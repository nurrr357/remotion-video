name: Daily AI batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render Agent reels
        run: npx remotion render AgentReels out/agent.mp4 --codec=h264 --concurrency=2

      - name: Render Agent still
        run: npx remotion still AgentReels out/agent.png --frame=30

      - name: Render Verify reels
        run: npx remotion render VerifyReels out/verify.mp4 --codec=h264 --concurrency=2

      - name: Render Verify still
        run: npx remotion still VerifyReels out/verify.png --frame=30

      - name: Render Video Agent reels
        run: npx remotion render VideoAgentReels out/videoagent.mp4 --codec=h264 --concurrency=2

      - name: Render Video Agent still
        run: npx remotion still VideoAgentReels out/videoagent.png --frame=30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-batch
          path: out/
          retention-days: 7
          if-no-files-found: error
